name: Test anonymous shared editing rules
on:
  push:
    paths: ['firestore.rules', 'guest-policy.mjs', 'shared-editor.js', 'emulator-tests/**', 'firebase-test.json', '.github/workflows/shared-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator-only test dependencies
        run: npm install --no-save --package-lock=false firebase @firebase/rules-unit-testing firebase-tools
      - name: Check syntax and seating behavior
        run: npm run check && npm test
      - name: Verify anonymous writes and private-data isolation in emulator
        run: npx firebase emulators:exec --only firestore --project demo-snu60-guest --config firebase-test.json 'node --test --test-concurrency=1 emulator-tests/shared-rules.mjs'
