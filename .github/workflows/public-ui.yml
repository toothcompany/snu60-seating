name: Public seating browser check
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public*'
      - 'editor*'
      - 'style.css'
      - '*.mjs'
      - 'shared-editor.js'
      - 'firebase-config.js'
      - 'tests/browser-*.mjs'
      - '.github/workflows/public-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-seating-browser-screenshots
          path: test-output/
          retention-days: 3
